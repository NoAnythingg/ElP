
<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontakt | EL POWER HS AB</title>
</head>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: #f5f7fb;
        font-family: Arial, Helvetica, sans-serif;
    }


    /* NAVIGATION */

    .topnav {
        overflow: hidden;

        background-color: rgba(22, 83, 227, 0.792);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        display: flex;
        justify-content: center;
        align-items: center;

        position: absolute;

        top: 15px;
        left: 20px;
        right: 20px;

        padding-inline: 30px;

        border-radius: 15px;

        box-shadow: 0 3px 15px rgba(17, 172, 228, 0.15);

        z-index: 10;
    }

    .topnav img {
        margin-right: auto;
        padding: 1vh;

        object-fit: contain;
    }

    .topnav a {
        color: #f2f2f2;

        text-align: center;

        padding: 14px 16px;

        text-decoration: none;

        font-size: 17px;

        transition: 0.2s;
    }

    .topnav a:hover {
        background-color: #ddd;
        color: black;
    }

    .topnav a.active {
        background-color: #04aa6d;
        color: white;
    }


    /* CONTACT HERO */

    .contactHeader {

        min-height: 55vh;

        background:
            linear-gradient(
                rgba(10, 30, 70, 0.78),
                rgba(10, 30, 70, 0.78)
            ),
            url("media/sect1_bg.jpg");

        background-size: cover;
        background-position: center;

        display: flex;
        flex-direction: column;
        justify-content: center;

        padding-left: 10%;
        padding-top: 40px;

        color: white;
    }

    .contactHeader h1 {
        margin: 0;

        font-size: clamp(55px, 9vw, 110px);

        line-height: 0.9;

        letter-spacing: -3px;
    }

    .contactHeader p {
        max-width: 600px;

        margin-top: 30px;

        font-size: 18px;

        line-height: 1.6;

        color: #e3e8f2;
    }


    /* CONTACT CONTENT */

    .contactContent {

        display: flex;

        gap: 30px;

        padding: 60px 10%;
    }

    .contactBox {

        background: white;

        padding: 30px;

        flex: 1;

        border-radius: 8px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .contactBox h2 {
        margin-top: 0;
    }


    /* FORM */

    input,
    textarea {

        width: 100%;

        padding: 12px;

        margin-bottom: 15px;

        border: 1px solid #ccc;

        border-radius: 4px;

        font-family: inherit;
    }

    textarea {
        height: 120px;
    }

    button {

        background-color: #1653e3;

        color: white;

        border: none;

        padding: 13px 25px;

        border-radius: 4px;

        cursor: pointer;
    }

    button:hover {
        background-color: #0f42bb;
    }

</style>


<body>

    <div class="topnav">

        <img
            src="logo_transparent horizontal.png"
            width="250"
            alt="EL POWER HS AB"
        >

        <a href="index.html">
            Startsida
        </a>

        <a href="about.html">
            Om oss
        </a>

    </div>


    <section class="contactHeader">

        <h1>
            KONTAKT
        </h1>

        <!-- <p>
            Behöver du hjälp med elinstallationer?
            Hör av dig till oss så hjälper vi dig.
        </p> -->

    </section>


    <section class="contactContent">


        <div class="contactBox">

            <h2>
                Skicka en förfrågan
            </h2>

            <form>

                <input
                    type="text"
                    placeholder="Namn"
                    required
                >

                <input
                    type="email"
                    placeholder="E-post"
                    required
                >

                <input
                    type="tel"
                    placeholder="Telefon"
                >

                <textarea
                    placeholder="Vad behöver du hjälp med?"
                ></textarea>

                <button type="submit">
                    SKICKA FÖRFRÅGAN
                </button>

            </form>

        </div>


        <div class="contactBox">

            <h2>
                EL POWER HS AB
            </h2>

            <p>
                <strong>Telefon</strong><br>
                NUMBER
            </p>

            <p>
                <strong>ADRESS</strong><br>
                Astervägen 20<br>
                232 39 Arlöv
            </p>

            <p>
                <strong>Verksamhet</strong><br>
                Elinstallationer
            </p>

        </div>


    </section>

</body>

</html>
